# Isolated test of the planned nginx -> API proxy-secret integration (P0d).
#
# Runs a REAL nginx (Ubuntu package, as on the VPS) with the exact proxy block
# planned for api.narofashion.co.tz, in front of the real Express + throttle
# tracker code. Test-only secret, temp directory, ports 18480/18481 on the
# runner. It never deploys, never connects to the VPS and has no secrets.
# The production nginx / env change stays a separate, owner-approved step
# (docs/OPS/PROXY_SECRET.md).
name: Proxy-secret integration test (isolated)

on:
  pull_request:
    paths:
      - 'apps/api/src/health/**'
      - 'apps/api/src/common/internal-call.ts'
      - 'apps/api/src/main.ts'
      - 'docs/OPS/PROXY_SECRET.md'
      - '.github/workflows/proxy-secret-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxy-secret-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx-proxy-secret:
    name: Real nginx in front of the throttle tracker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install nginx
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nginx-light || sudo apt-get install -y -q nginx
          sudo systemctl stop nginx || true
          nginx -v

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Proxy-secret tests (real nginx required)
        working-directory: apps/api
        env:
          REQUIRE_NGINX: '1'
        run: npx jest src/health/proxy-secret.nginx.spec.ts src/health/app-throttler-trust.spec.ts --verbose
